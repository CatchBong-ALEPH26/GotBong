<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>유령 키보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>유령 키보드</h1>
    <span id="mode-badge" class="badge" hidden>테스트 모드</span>
    <span id="remaining" class="remaining" aria-live="polite"></span>
    <button id="reset-btn" type="button" class="secondary">처음부터</button>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <main>
    <section class="panel" id="intro-panel">
      <h2>사건 개요</h2>
      <p id="intro" class="intro"></p>
      <p id="victim" class="victim" hidden></p>
      <h3>시작 단서</h3>
      <ul id="clues" class="clues"></ul>
    </section>

    <section class="panel" id="chat-panel">
      <h2>대화</h2>
      <div id="npc-tabs" class="tabs" role="tablist" aria-label="NPC 선택"></div>
      <div id="log" class="log" aria-live="polite"></div>

      <form id="ask-form" class="ask">
        <label for="attachment">단서나 발언 첨부 (선택)</label>
        <select id="attachment"></select>
        <label for="question">질문</label>
        <textarea id="question" rows="3" maxlength="500" required placeholder="선택한 NPC에게 물어볼 내용을 입력하세요"></textarea>
        <div class="row">
          <button id="ask-btn" type="submit">질문하기</button>
          <span id="ask-status" class="status" aria-live="polite"></span>
        </div>
      </form>
    </section>

    <section class="panel" id="submit-panel">
      <h2>최종 제출</h2>
      <form id="final-form" class="ask">
        <label for="final-npc">범인이라고 생각하는 NPC</label>
        <select id="final-npc" required></select>
        <label for="motive">동기</label>
        <textarea id="motive" rows="3" maxlength="500" required placeholder="그 사람의 동기를 적으세요"></textarea>
        <div class="row">
          <button id="final-btn" type="submit" class="danger">최종 제출</button>
          <span id="final-status" class="status" aria-live="polite"></span>
        </div>
      </form>
      <div id="result" class="result" hidden>
        <h3>결과</h3>
        <p id="result-score" class="result-score"></p>
        <p id="result-truth"></p>
        <table id="result-cast" hidden>
          <thead><tr><th scope="col">이름</th><th scope="col">사건 속 역할</th></tr></thead>
          <tbody id="result-cast-body"></tbody>
        </table>
      </div>
    </section>

    <details id="trace-panel" class="panel trace" hidden>
      <summary>디버그 정보</summary>
      <div id="trace-body"></div>
    </details>
  </main>

  <script src="app.js"></script>
</body>
</html>
